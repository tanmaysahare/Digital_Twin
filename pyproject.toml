[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin-ai"
version = "0.1.0"
description = "A live read-only digital twin of a mixed-model vehicle assembly line"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
  "simpy>=4.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "shap>=0.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.99",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-pyyaml",
  "pip-audit>=2.7",
]

[tool.setuptools]
packages = ["connector", "evaluation", "plantsim", "tools", "twin"]

[tool.ruff]
line-length = 88
target-version = "py311"
# docs/ holds one documentation utility, the reference sheet generator. It is
# not application source and is not held to the application type standard.
extend-exclude = ["web", ".venv", "docs"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # import order
  "N",           # naming
  "UP",          # pyupgrade
  "B",           # bugbear
  "A",           # builtin shadowing
  "C4",          # comprehensions
  "DTZ",         # naive datetimes
  "T20",         # print outside tools
  "SIM",         # simplify
  "ARG",         # unused arguments
  "PTH",         # pathlib over os.path
  "PL",          # pylint subset
  "RUF",
  "ANN",         # missing annotations
  "BLE",         # blind except
  "TRY",         # exception handling
  "D",           # docstrings
  "NPY",         # numpy legacy random, see CODING_STANDARDS 1.4
]
ignore = [
  "D203",        # conflicts with D211
  "D213",        # conflicts with D212
  "D104",        # package docstrings are not required on every __init__
  "TRY003",      # long messages inline: our error strings are written for people
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PLR2004", "T20", "PLR0913", "PLR0917", "ARG001", "SLF001", "PLC0415"]
"tools/*" = ["T20"]
# `evaluation/run.py` is what `make evaluate` calls, and a command line tool
# that produced no output would be a command line tool nobody could use. The
# harness prints its progress for the same reason: an evaluation that takes
# twenty minutes has to say where it has got to.
"evaluation/run.py" = ["T20"]
"evaluation/harness.py" = ["T20", "PLW0603", "PLC0415", "PLR0913", "PLR0917", "PLR0911"]
# The numerical kernels take the arguments they take. `simulate_once` needs the
# line shape, the seed, the clock, the generator and the horizon, and folding
# them into one object would move the argument list rather than shorten it,
# while costing an attribute lookup per station visit in the one loop where
# that is measurable. The branch and statement counts on the same function are
# the recursion itself, which is one loop and reads as one.
"twin/forecast/des.py" = ["PLR0913", "PLR0917", "PLR0912", "PLR0915"]
"twin/forecast/drift.py" = ["PLR0913", "PLR0917"]
# The report renders a document. Its writers take the summary, the settings,
# the runs and the determinism result because a report needs all four.
"evaluation/report.py" = ["PLR0913", "PLR0917"]
# A serialiser assembles one response out of many parts, and a response with
# nine fields needs nine of them. Folding them into a carrier object would
# move the argument list rather than shorten it, and the carrier would exist
# only to satisfy the rule.
"twin/api/serialise.py" = ["PLR0913", "PLR0917"]
"twin/api/routes.py" = ["PLR0913", "PLR0917"]
# SHAP is optional at runtime and is imported where it is used, so that a
# missing explainer degrades that one capability rather than the process.
"twin/defect/explain.py" = ["PLC0415"]
# Migration bodies are generated from twin/db/schema.py. Reflowing the generated
# table definitions to satisfy the line length would make every future
# regeneration a diff, and upgrade and downgrade say what they do in the module
# docstring rather than twice over.
"migrations/versions/*" = ["D103", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["connector", "evaluation", "plantsim", "tools", "twin"]
exclude = '(^|/)(\.venv|web|node_modules)/'
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["simpy.*", "lightgbm.*", "shap.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "database: needs a running PostgreSQL with TimescaleDB",
  "scenario: runs a full scenario against the simulator",
]
filterwarnings = ["error::DeprecationWarning"]
