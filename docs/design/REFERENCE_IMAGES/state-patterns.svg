<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" font-family="Inter, 'IBM Plex Sans', system-ui, sans-serif"><rect width="1180" height="300" fill="#FAF9F7"/><text x="32" y="40" font-size="20" font-weight="600" fill="#1A1A1A">Station states</text><text x="32" y="60" font-size="12" fill="#7A7975">Every state carries colour, pattern and text. Colour is never the only signal.</text><line x1="32" y1="76" x2="1148" y2="76" stroke="#B5B2AB" stroke-width="1"/><defs><pattern id="p-drift" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#B8860B"/><rect width="3" height="8" fill="#1A1A1A" opacity="0.22"/></pattern><pattern id="p-blocked" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#C2701C"/><rect width="3" height="8" fill="#1A1A1A" opacity="0.22"/></pattern><pattern id="p-starved" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#C2701C"/><rect width="8" height="3" fill="#1A1A1A" opacity="0.22"/></pattern><pattern id="p-dark" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#F3F1ED"/><path d="M0,7 L7,0 M-1,1 L1,-1 M6,8 L8,6" stroke="#8C8A85" stroke-width="1"/></pattern></defs><defs><pattern id="p-drift-g" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#868686"/><rect width="3" height="8" fill="#191919" opacity="0.22"/></pattern><pattern id="p-blocked-g" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#7e7e7e"/><rect width="3" height="8" fill="#191919" opacity="0.22"/></pattern><pattern id="p-starved-g" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#7e7e7e"/><rect width="8" height="3" fill="#191919" opacity="0.22"/></pattern><pattern id="p-dark-g" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#f1f1f1"/><path d="M0,7 L7,0 M-1,1 L1,-1 M6,8 L8,6" stroke="#8a8a8a" stroke-width="1"/></pattern></defs><text x="32" y="104" font-size="12" font-weight="600" fill="#4A4A48">Colour</text><rect x="32" y="114" width="150" height="52" fill="#FFFFFF" stroke="#D9D6D0"/><text x="40" y="132" font-size="11" font-weight="600" fill="#1A1A1A">Running</text><text x="40" y="148" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#1A1A1A">62.1 s</text><text x="40" y="161" font-size="9" fill="#1A1A1A" opacity="0.75">greyscale, no fill</text><rect x="190" y="114" width="150" height="52" fill="url(#p-drift)" stroke="#D9D6D0"/><text x="198" y="132" font-size="11" font-weight="600" fill="#1A1A1A">Drifting</text><text x="198" y="148" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#1A1A1A">62.1 s  +4.1</text><text x="198" y="161" font-size="9" fill="#1A1A1A" opacity="0.75">diagonal stripe</text><rect x="348" y="114" width="150" height="52" fill="url(#p-blocked)" stroke="#D9D6D0"/><text x="356" y="132" font-size="11" font-weight="600" fill="#1A1A1A">Blocked</text><text x="356" y="148" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#1A1A1A">held 41 s</text><text x="356" y="161" font-size="9" fill="#1A1A1A" opacity="0.75">vertical stripe</text><rect x="506" y="114" width="150" height="52" fill="url(#p-starved)" stroke="#D9D6D0"/><text x="514" y="132" font-size="11" font-weight="600" fill="#1A1A1A">Starved</text><text x="514" y="148" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#1A1A1A">waiting 18 s</text><text x="514" y="161" font-size="9" fill="#1A1A1A" opacity="0.75">horizontal stripe</text><rect x="664" y="114" width="150" height="52" fill="#A32020"/><text x="672" y="132" font-size="11" font-weight="600" fill="#FFFFFF">Down</text><text x="672" y="148" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#FFFFFF">stopped 6 min</text><text x="672" y="161" font-size="9" fill="#FFFFFF" opacity="0.75">solid, white text</text><rect x="822" y="114" width="150" height="52" fill="#FFFFFF" stroke="#B8860B" stroke-width="2" stroke-dasharray="0"/><text x="830" y="132" font-size="11" font-weight="600" fill="#1A1A1A">Forecast</text><text x="830" y="148" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#1A1A1A">09:52 to 10:04</text><text x="830" y="161" font-size="9" fill="#1A1A1A" opacity="0.75">2px outline, no fill</text><rect x="980" y="114" width="150" height="52" fill="url(#p-dark)" stroke="#D9D6D0"/><text x="988" y="132" font-size="11" font-weight="600" fill="#1A1A1A">No machine data</text><text x="988" y="148" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#1A1A1A">54 to 71 s</text><text x="988" y="161" font-size="9" fill="#1A1A1A" opacity="0.75">cross-hatch</text><text x="32" y="196" font-size="12" font-weight="600" fill="#4A4A48">Same sheet in greyscale. Every state stays distinguishable.</text><rect x="32" y="206" width="150" height="52" fill="#ffffff" stroke="#d6d6d6"/><text x="40" y="224" font-size="11" font-weight="600" fill="#191919">Running</text><text x="40" y="240" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#191919">62.1 s</text><text x="40" y="253" font-size="9" fill="#191919" opacity="0.75">greyscale, no fill</text><rect x="190" y="206" width="150" height="52" fill="url(#p-drift-g)" stroke="#d6d6d6"/><text x="198" y="224" font-size="11" font-weight="600" fill="#191919">Drifting</text><text x="198" y="240" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#191919">62.1 s  +4.1</text><text x="198" y="253" font-size="9" fill="#191919" opacity="0.75">diagonal stripe</text><rect x="348" y="206" width="150" height="52" fill="url(#p-blocked-g)" stroke="#d6d6d6"/><text x="356" y="224" font-size="11" font-weight="600" fill="#191919">Blocked</text><text x="356" y="240" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#191919">held 41 s</text><text x="356" y="253" font-size="9" fill="#191919" opacity="0.75">vertical stripe</text><rect x="506" y="206" width="150" height="52" fill="url(#p-starved-g)" stroke="#d6d6d6"/><text x="514" y="224" font-size="11" font-weight="600" fill="#191919">Starved</text><text x="514" y="240" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#191919">waiting 18 s</text><text x="514" y="253" font-size="9" fill="#191919" opacity="0.75">horizontal stripe</text><rect x="664" y="206" width="150" height="52" fill="#474747"/><text x="672" y="224" font-size="11" font-weight="600" fill="#FFFFFF">Down</text><text x="672" y="240" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#FFFFFF">stopped 6 min</text><text x="672" y="253" font-size="9" fill="#FFFFFF" opacity="0.75">solid, white text</text><rect x="822" y="206" width="150" height="52" fill="#ffffff" stroke="#868686" stroke-width="2" stroke-dasharray="0"/><text x="830" y="224" font-size="11" font-weight="600" fill="#191919">Forecast</text><text x="830" y="240" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#191919">09:52 to 10:04</text><text x="830" y="253" font-size="9" fill="#191919" opacity="0.75">2px outline, no fill</text><rect x="980" y="206" width="150" height="52" fill="url(#p-dark-g)" stroke="#d6d6d6"/><text x="988" y="224" font-size="11" font-weight="600" fill="#191919">No machine data</text><text x="988" y="240" font-size="11" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#191919">54 to 71 s</text><text x="988" y="253" font-size="9" fill="#191919" opacity="0.75">cross-hatch</text></svg>