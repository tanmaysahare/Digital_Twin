rains Mono', ui-monospace, monospace" fill="#1A1A1A" text-anchor="end">58.2 s</text><text x="32" y="517" font-size="13" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#1A1A1A">S34</text><text x="180" y="517" font-size="13" font-family="'IBM Plex Mono', 'JetBrains Mono', ui-monospace, monospace" fill="#1A1A1A" text-anchor="end">54 to 71 s</text><text x="300" y="517" font-size="11" fill="#6F6E6A">an interval, because that is what is known about S34</text></svg>