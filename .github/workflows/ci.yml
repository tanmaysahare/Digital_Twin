name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and design rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install web dependencies
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm ci

      - name: Lint
        run: make lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.15.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digitaltwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DIGITALTWIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/digitaltwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install web dependencies
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm ci

      - name: Test
        run: make test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      # The project path is the argument. Without it pip-audit audits the
      # environment, which in this job holds only pip-audit and the pip and
      # setuptools that ensurepip bundles, so the job graded the runner's
      # toolchain rather than anything this repository declares.
      - name: Audit Python dependencies
        run: pip-audit . --strict --desc
