# Five services (ARCHITECTURE.md Section 3). `api` and `worker` share a codebase
# and differ by entrypoint so that a Monte Carlo run cannot block a request.

name: digitaltwin

services:
  db:
    image: timescale/timescaledb:2.15.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-digitaltwin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-digitaltwin}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["uvicorn", "twin.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DIGITALTWIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-digitaltwin}
      DIGITALTWIN_LINE_CONFIG: config/lines/line2.yaml
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "-m", "twin.workers.cycle"]
    environment:
      DIGITALTWIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-digitaltwin}
      DIGITALTWIN_LINE_CONFIG: config/lines/line2.yaml
    depends_on:
      db:
        condition: service_healthy

  sim:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    command: ["python", "-m", "plantsim.run"]
    environment:
      DIGITALTWIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-digitaltwin}
      DIGITALTWIN_LINE_CONFIG: config/lines/line2.yaml
      DIGITALTWIN_TIME_SCALE: "60"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
