# The simulator's parameters for Line 2. Ground truth, not configuration.
#
# The twin never loads this file. It holds the true cycle times, the true
# failure rates and the true defect causes, and if the twin could read them
# every number in the evidence pack would be worthless. The same separation is
# enforced again in the database: what the simulator records from these
# parameters lands in the `truth` schema, which the application role has no
# grant on (AC-104).
#
# The numbers are fictional and are dimensioned from the problem statement's
# directional parameters. They are chosen so that no station is over takt at
# baseline, which is what makes scenario SC-06 a meaningful null case.

line_id: line2
description: Line 2 as the plant actually behaves, including what no sensor sees
epoch: "2026-03-02T06:00:00+00:00"

# The twin holds transport times as nominal figures from the line definition.
# The plant does not reproduce them exactly, and this is the gap the twin's
# transport tolerance has to cover. It is also why a derived cycle time is an
# interval even where one dark station sits alone between two instrumented ones.
transport_cv: 0.04

# A gate returns its verdict this long after the unit left the station it
# inspects. The latency is why an inspection result never anchors a cycle-time
# interval: its timestamp is when a verdict was recorded, not when work stopped.
gate_latency_s: 45.0

station_defaults:
  cycle_cv: 0.05
  # Production seconds between in-process failures, and how long a repair takes.
  # Failures are operation-dependent: a station cannot fail while it is idle.
  mtbf_s: 240000.0
  mttr_median_s: 90.0
  mttr_sigma: 0.6

zones:
  - id: body
    temperature_c: 23.0
    temperature_sd_c: 0.6
    humidity_pct: 45.0
    humidity_sd_pct: 2.0
    variant_cycle_factor: {V-STD: 1.00, V-SPT: 1.05, V-LWB: 1.09}
  - id: paint
    temperature_c: 22.0
    temperature_sd_c: 0.4
    humidity_pct: 55.0
    humidity_sd_pct: 1.5
    # Paint work is a booth cycle and barely varies by body variant. A single
    # line-wide factor would make the paint zone the bottleneck for the
    # long-wheelbase variant, which is not what happens on a real line.
    variant_cycle_factor: {V-STD: 1.00, V-SPT: 1.01, V-LWB: 1.02}
  - id: final
    temperature_c: 24.0
    temperature_sd_c: 0.7
    humidity_pct: 48.0
    humidity_sd_pct: 2.5
    variant_cycle_factor: {V-STD: 1.00, V-SPT: 1.06, V-LWB: 1.10}

# S20 sits at 58 s so that scenario SC-01 can drift it to 63 s and cross takt
# without ever leaving the tolerance band a threshold alarm would watch.
# S34 sits at 49 s so that SC-05 can add 8 s to a station no sensor observes.
stations:
  - {id: S01, base_cycle_s: 47.0}
  - {id: S02, base_cycle_s: 46.0}
  - {id: S03, base_cycle_s: 48.0}
  - {id: S04, base_cycle_s: 45.0}
  - {id: S05, base_cycle_s: 49.0}
  - {id: S06, base_cycle_s: 47.0}
  - {id: S07, base_cycle_s: 50.0, cycle_cv: 0.08}
  - {id: S08, base_cycle_s: 46.0}
  - {id: S09, base_cycle_s: 48.0}
  - {id: S10, base_cycle_s: 47.0}
  - {id: S11, base_cycle_s: 49.0}
  - {id: S12, base_cycle_s: 45.0}
  - {id: S13, base_cycle_s: 48.0, cycle_cv: 0.08}
  - {id: S14, base_cycle_s: 47.0, cycle_cv: 0.08}
  - {id: S15, base_cycle_s: 46.0}
  - {id: S16, base_cycle_s: 49.0}
  - {id: S17, base_cycle_s: 52.0}
  - {id: S18, base_cycle_s: 50.0}
  - {id: S19, base_cycle_s: 53.0}
  - {id: S20, base_cycle_s: 58.0, cycle_cv: 0.04}
  - {id: S21, base_cycle_s: 51.0}
  - {id: S22, base_cycle_s: 53.0}
  - {id: S23, base_cycle_s: 49.0}
  - {id: S24, base_cycle_s: 52.0}
  - {id: S25, base_cycle_s: 50.0}
  - {id: S26, base_cycle_s: 51.0}
  - {id: S27, base_cycle_s: 47.0}
  - {id: S28, base_cycle_s: 45.0}
  - {id: S29, base_cycle_s: 48.0}
  - {id: S30, base_cycle_s: 46.0}
  - {id: S31, base_cycle_s: 49.0, cycle_cv: 0.07}
  - {id: S32, base_cycle_s: 44.0, cycle_cv: 0.08}
  # The dark span. Manual work, so the spread is wider and the twin has to say
  # so from flanking evidence alone.
  - {id: S33, base_cycle_s: 46.0, cycle_cv: 0.10}
  - {id: S34, base_cycle_s: 49.0, cycle_cv: 0.10}
  - {id: S35, base_cycle_s: 47.0, cycle_cv: 0.10}
  - {id: S36, base_cycle_s: 45.0, cycle_cv: 0.10}
  - {id: S37, base_cycle_s: 48.0, cycle_cv: 0.10}
  - {id: S38, base_cycle_s: 47.0}
  - {id: S39, base_cycle_s: 46.0}
  - {id: S40, base_cycle_s: 48.0, cycle_cv: 0.08}
  - {id: S41, base_cycle_s: 45.0, cycle_cv: 0.08}
  - {id: S42, base_cycle_s: 44.0, cycle_cv: 0.10}

gates:
  - {id: G1, base_failure_rate: 0.008}
  - {id: G2, base_failure_rate: 0.009}
  - {id: G3, base_failure_rate: 0.014}

defects:
  # A unit whose cycle ran high at a station in the gate's span is more likely
  # to fail it. This is the coupling the defect model has to find, and it is
  # the reason timing features carry any signal at all.
  cycle_deviation_odds_per_sigma: 1.35
  cycle_deviation_threshold_sigma: 1.0
  humidity_odds_per_pct_above: 1.06
  lot_quality_sigma: 0.30
  rework_odds_multiplier: 1.6
  # Held at one. A dark station is not a worse station, and the evaluation has
  # to be free of any coupling that would let the twin look right by fearing
  # the stations it cannot see.
  dark_visit_odds_multiplier: 1.0

# What a tier A station reports beside its clock. The coupling is the share of
# a signal's deviation that moves with the station's own cycle deviation, which
# is what gives the defect model something to find in a process value.
signals:
  - {name: torque, unit: N_m, nominal: 42.0, sd: 1.20, cycle_coupling: 0.55}
  - {name: torque_angle, unit: degree, nominal: 31.0, sd: 1.80, cycle_coupling: 0.30}
  - {name: motor_current, unit: A, nominal: 6.40, sd: 0.35, cycle_coupling: 0.45}
  - {name: vibration_rms, unit: mm_s, nominal: 2.10, sd: 0.22, cycle_coupling: 0.40}
  - {name: dimensional_deviation, unit: mm, nominal: 0.05, sd: 0.08, cycle_coupling: 0.35}

materials:
  # Lot numbering starts here so that B-4471 is the second lot of a run, which
  # is the lot scenario SC-02 takes off spec.
  - {part: sill reinforcement, station: S07, lot_size: 150, lot_prefix: B, lot_start: 4470}
  - {part: door seal, station: S24, lot_size: 150, lot_prefix: D, lot_start: 2210}
  - {part: wiring harness, station: S30, lot_size: 120, lot_prefix: H, lot_start: 8830}

# A checklist at a dark station is filled in when the operator gets to it.
manual_check_latency_s: 90.0
env_sample_s: 300.0
max_rework_passes: 2

# A vehicle identification number is 17 characters. The prefix is the part that
# does not change from unit to unit on this line.
unit_id_prefix: 3C4PDCBG7JT
unit_id_start: 100000

operator_group_by_shift: {A: A-crew, B: B-crew}

# Two shifts at a 60 s takt give 920 takt slots a day. The line plans
# for 880, and the 40 unit difference is the blocking, starving and repair a
# 42 station line loses even when nothing is wrong with it.
nominal_output_per_day: 880
